name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  brew-audit:
    runs-on: macos-14
    env:
      HOMEBREW_TAP: mikesplain/unsloth
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure local tap
        run: |
          brew untap "$HOMEBREW_TAP" || true
          brew tap "$HOMEBREW_TAP" "$GITHUB_WORKSPACE"

      - name: Audit cask
        run: brew audit --cask --strict --online --except min_os,livecheck_version,livecheck_https_availability,hosting_with_livecheck,github_prerelease_version "$HOMEBREW_TAP/unsloth"

      - name: Style cask
        run: brew style Casks/unsloth.rb

      - name: Install cask
        run: brew install --cask "$HOMEBREW_TAP/unsloth"

      - name: Verify installation
        run: |
          test -d "/Applications/Unsloth.app"
          codesign --verify --deep --strict "/Applications/Unsloth.app"

      - name: Uninstall cask
        run: brew uninstall --cask "$HOMEBREW_TAP/unsloth"
